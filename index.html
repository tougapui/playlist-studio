<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131B2C'/%3E%3Cg stroke='%23C9A35A' fill='none' stroke-linecap='round'%3E%3Ccircle cx='16' cy='16' r='10' stroke-width='2'/%3E%3Cpath d='M10.5 13c4-1.5 7-1.5 11 0' stroke-width='2'/%3E%3Cpath d='M11 16.5c3.2-1.2 6.8-1.2 10 0' stroke-width='1.8'/%3E%3Cpath d='M12 20c2.5-.9 5.5-.9 8 0' stroke-width='1.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<div class="noise-overlay" aria-hidden="true"></div>
<span class="corner-mark corner-mark--tl" aria-hidden="true">⌐</span>
<span class="corner-mark corner-mark--br" aria-hidden="true">⌐</span>

<header class="site-header">
  <div class="site-header__identity">
    <span class="site-header__owner">⌐ ryuushouin touga</span>
    <span class="site-header__brand">playlist studio</span>
  </div>
</header>

<ul class="site-notice">
  <li>Spotify 訂閱用戶請先<a href="https://accounts.spotify.com/login" target="_blank" rel="noopener noreferrer">登入 Spotify ↗</a>,即可在此收聽完整歌曲</li>
  <li>若已登入仍只有 30 秒試聽,請確認瀏覽器未封鎖第三方 Cookie(需將 open.spotify.com 加入例外)</li>
  <li>未登入僅提供 30 秒試聽</li>
</ul>

<main id="main">
  <section class="view view-wall">
    <div id="wall-families"></div>
  </section>
</main>

<footer class="site-footer">
  <span>curated on spotify · <span id="footer-year"></span></span>
  <span class="corner-mark corner-mark--inline">⌐</span>
</footer>

<aside id="player-sidebar" class="player-sidebar">
  <div class="player-sidebar__header">
    <span class="player-sidebar__name" id="player-name"></span>
    <button type="button" class="player-sidebar__close" id="player-close" aria-label="關閉播放器">✕</button>
  </div>
  <div class="player-sidebar__embed" id="player-embed"></div>
</aside>

<script src="app.js?v=9"></script>
</body>
</html>
