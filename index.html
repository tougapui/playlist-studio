<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="noise-overlay" aria-hidden="true"></div>
<span class="corner-mark corner-mark--tl" aria-hidden="true">⌐</span>
<span class="corner-mark corner-mark--br" aria-hidden="true">⌐</span>

<header class="site-header">
  <div class="site-header__identity">
    <span class="site-header__brand">
      ⌐ ryuushouin touga ·
      <svg class="spotify-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.8 9.6c3.6-1.4 6.8-1.4 10.4 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M7.3 12.4c2.9-1.1 6.5-1.1 9.4 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.9 15.1c2.2-0.8 5.1-0.8 7.3 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      playlist studio
    </span>
  </div>
</header>

<ul class="site-notice">
  <li>Spotify 訂閱用戶請先登入 Spotify,即可在此收聽完整歌曲</li>
  <li>若已登入仍只有 30 秒試聽,請確認瀏覽器未封鎖第三方 Cookie(需將 open.spotify.com 加入例外)</li>
  <li>未登入僅提供 30 秒試聽</li>
</ul>

<main id="main">
  <section class="view view-wall">
    <div id="wall-families"></div>
  </section>
</main>

<footer class="site-footer">
  <span>curated on spotify · <span id="footer-year"></span></span>
  <span class="corner-mark corner-mark--inline">⌐</span>
</footer>

<div id="player-bar" class="player-bar">
  <div class="player-bar__header">
    <span class="player-bar__name" id="player-name"></span>
    <button type="button" class="player-bar__close" id="player-close" aria-label="關閉播放器">✕</button>
  </div>
  <div class="player-bar__embed" id="player-embed"></div>
</div>

<script src="app.js"></script>
</body>
</html>
